name: Build & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OneButtonShare.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OneButtonShare-apk
          path: OneButtonShare.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" OneButtonShare.apk \
            --title "OneButtonShare $TAG" \
            --notes "Android 分享菜单应用：在相册选图 → 分享 → 选择本应用，生成二维码，iPhone 扫码即可加入局域网并接收照片。

          使用方法：
          1. 安装 OneButtonShare.apk（需允许安装未知来源应用）
          2. 相册选图 → 分享 → OneButtonShare
          3. 如 iPhone 未连同一 Wi-Fi：点「① 加入Wi-Fi」扫码加入
          4. 点「② 传输照片」，iPhone 相机扫码，在 Safari 长按图片保存到相册"
